<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuliner Khas Medan - Aplikasi Pengguna</title>
<style>
  :root { --marun:#6b1f2a; --emas:#a67c00; --krem:#faf5ec; --garis:#e4d8c3; --teks:#2b2220; --bahaya:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background:var(--krem); color:var(--teks); }
  .wadah { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header.atas { background: var(--marun); color:#fff; padding: 12px 0; position:sticky; top:0; z-index:5; }
  header.atas .wadah { display:flex; align-items:center; gap:12px; }
  header.atas a { color:#fff; text-decoration:none; font-weight:700; font-size:18px; flex:1; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--garis); background:#fff; border-radius:8px; cursor:pointer; }
  button:hover { border-color: var(--marun); }
  button.utama { background: var(--marun); color:#fff; border-color: var(--marun); }
  button.bahaya { color: var(--bahaya); border-color: #e8b9b5; }
  header button { background:transparent; color:#fff; border-color:#ffffff66; }
  input, select, textarea { font:inherit; padding:9px 10px; border:1px solid var(--garis); border-radius:8px; width:100%; background:#fff; }
  label { display:block; font-size:13px; margin: 10px 0 4px; color:#5a4a44; }
  .kartu-form { background:#fff; border:1px solid var(--garis); border-radius:14px; padding:22px; max-width:400px; margin:36px auto; }
  .galat { color: var(--bahaya); font-size:13px; min-height:18px; margin:8px 0; white-space:pre-line; }
  .tautan { background:none; border:none; color:var(--marun); text-decoration:underline; padding:0; }
  .alat { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 6px; }
  .alat input { flex:2; min-width:180px; width:auto; }
  .alat select { flex:1; min-width:160px; width:auto; }
  .info { color:#7a6a63; font-size:13px; margin:6px 0 12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:16px; }
  a.kartu { display:flex; flex-direction:column; background:#fff; border:1px solid var(--garis); border-radius:14px; overflow:hidden; color:inherit; text-decoration:none; }
  a.kartu:hover { box-shadow:0 6px 16px #3c1e0a1f; }
  .foto { aspect-ratio: 16 / 10; background:#eadcc6; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .foto img { width:100%; height:100%; object-fit:cover; display:block; }
  .inisial { font-family:Georgia, serif; font-size:48px; color:var(--marun); opacity:.55; }
  .isi { padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .isi h3 { margin:0; font-family:Georgia, serif; font-size:17px; }
  .sub { color:#7a6a63; font-size:13px; }
  .bar { display:flex; justify-content:space-between; font-size:13px; margin-top:auto; padding-top:8px; }
  .rating, .bintang { color: var(--emas); font-weight:600; }
  .label { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#f3ead9; color:#6b5a1d; margin:2px 4px 0 0; }
  .label.nonhalal { background:#fde8e6; color:#9b2c20; }
  .pager { display:flex; gap:10px; align-items:center; justify-content:center; margin:22px 0 36px; font-size:14px; }
  .panel { background:#fff; border:1px solid var(--garis); border-radius:14px; padding:18px; margin:16px 0; }
  .detail-atas { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:16px; }
  @media (max-width: 720px) { .detail-atas { grid-template-columns: 1fr; } }
  .foto-besar { aspect-ratio:16 / 10; background:#eadcc6; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .foto-besar img { width:100%; height:100%; object-fit:cover; display:block; }
  .menu-baris { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px dashed var(--garis); }
  .menu-grup { margin:14px 0 4px; color:var(--marun); }
  .ulasan { padding:10px 0; border-bottom:1px solid var(--garis); }
  .ulasan small { color:#7a6a63; }
  .tombol { display:inline-block; padding:8px 14px; background:var(--marun); color:#fff; border-radius:8px; text-decoration:none; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2b2220; color:#fff; padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.tampil { opacity:1; }
</style>
</head>
<body>
<header class="atas">
  <div class="wadah">
    <a href="#/">Kuliner Khas Medan</a>
    <span id="info-user"></span>
    <button id="btn-keluar" data-aksi="keluar" hidden>Keluar</button>
  </div>
</header>

<main class="wadah">
  <section id="v-masuk" class="kartu-form">
    <h1 id="j-masuk" style="margin-top:0">Masuk</h1>
    <p class="info">Masuk atau daftar dulu untuk melihat daftar restoran dan menulis ulasan.</p>
    <form id="f-masuk">
      <label for="m-user">Username</label>
      <input id="m-user" name="username" autocomplete="username" required>
      <label for="m-pass">Password</label>
      <input id="m-pass" name="password" type="password" autocomplete="current-password" required>
      <p id="galat-masuk" class="galat" role="alert"></p>
      <button class="utama" type="submit" id="btn-masuk">Masuk</button>
    </form>
    <p class="info"><span id="teks-ganti">Belum punya akun?</span>
      <button class="tautan" data-aksi="ganti-mode" type="button" id="btn-ganti">Daftar</button></p>
  </section>

  <section id="v-daftar" hidden>
    <div class="alat">
      <input id="q" placeholder="Cari nama restoran" aria-label="Cari nama restoran">
      <select id="kategori" aria-label="Kategori"><option value="">Semua kategori</option></select>
      <button class="utama" data-aksi="cari" type="button">Cari</button>
    </div>
    <p id="info-daftar" class="info"></p>
    <div id="grid" class="grid"></div>
    <div id="pager" class="pager"></div>
  </section>

  <section id="v-detail" hidden></section>
</main>

<div id="toast" role="status"></div>

<script>
'use strict';
const API = '/api/v1';
const $ = (s) => document.querySelector(s);
let token = sessionStorage.getItem('pub_token') || '';
let saya = sessionStorage.getItem('pub_nama') || '';
let modeDaftar = false;
const st = { page: 1, total_pages: 1 };

function h(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(teks) {
  const t = $('#toast');
  t.textContent = teks;
  t.classList.add('tampil');
  setTimeout(() => t.classList.remove('tampil'), 2600);
}
function pesanGalat(e) {
  let p = e && e.pesan ? e.pesan : 'Terjadi kesalahan.';
  if (e && e.errors) p += '\n' + Object.entries(e.errors).map(([k, v]) => '- ' + k + ': ' + v).join('\n');
  return p;
}
function rupiah(r) {
  const min = r.harga && r.harga.min, max = r.harga && r.harga.max;
  if (!max) return '';
  return 'Rp ' + Math.round((min || 0) / 1000) + '\u2013' + Math.round(max / 1000) + ' rb';
}
function labelHalal(teks) {
  if (!teks) return '';
  const k = /^non|belum/i.test(teks) ? (/^non/i.test(teks) ? ' nonhalal' : '') : '';
  return `<span class="label${k}">${h(teks)}</span>`;
}
function fotoSrc(p) {
  return p ? '/' + String(p).replace(/^\/+/, '') : null;
}

async function api(metode, path, body) {
  const opt = { method: metode, headers: { 'Content-Type': 'application/json' } };
  if (token) opt.headers.Authorization = 'Bearer ' + token;
  if (body !== undefined) opt.body = JSON.stringify(body);
  let res;
  try {
    res = await fetch(API + path, opt);
  } catch (e) {
    throw { kode: 0, pesan: 'Tidak bisa menghubungi server API.' };
  }
  let json = null;
  try { json = await res.json(); } catch (e) { /* bukan JSON */ }
  if (res.status === 401 && token) {
    keluar();
    throw { kode: 401, pesan: 'Sesi berakhir, silakan masuk lagi.' };
  }
  if (!res.ok) {
    throw { kode: res.status, pesan: (json && json.message) || 'Terjadi kesalahan.', errors: json && json.errors };
  }
  return json;
}

/* ---------- masuk, daftar, keluar ---------- */
function atur(mode) {
  modeDaftar = mode;
  $('#j-masuk').textContent = mode ? 'Daftar akun baru' : 'Masuk';
  $('#btn-masuk').textContent = mode ? 'Daftar' : 'Masuk';
  $('#teks-ganti').textContent = mode ? 'Sudah punya akun?' : 'Belum punya akun?';
  $('#btn-ganti').textContent = mode ? 'Masuk' : 'Daftar';
  $('#m-pass').autocomplete = mode ? 'new-password' : 'current-password';
  $('#galat-masuk').textContent = '';
}
function mulai() {
  $('#v-masuk').hidden = true;
  $('#btn-keluar').hidden = false;
  $('#info-user').textContent = 'Halo, ' + saya;
  muatKategori();
  arahkan();
}
function keluar() {
  token = '';
  saya = '';
  sessionStorage.removeItem('pub_token');
  sessionStorage.removeItem('pub_nama');
  $('#v-masuk').hidden = false;
  $('#v-daftar').hidden = true;
  $('#v-detail').hidden = true;
  $('#btn-keluar').hidden = true;
  $('#info-user').textContent = '';
}
async function masuk(username, password) {
  const r = await api('POST', '/auth/login', { username, password });
  token = r.data.token;
  saya = r.data.username;
  sessionStorage.setItem('pub_token', token);
  sessionStorage.setItem('pub_nama', saya);
  mulai();
}
$('#f-masuk').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const u = String(fd.get('username')).trim();
  const p = String(fd.get('password'));
  $('#galat-masuk').textContent = '';
  try {
    if (modeDaftar) await api('POST', '/auth/daftar', { username: u, password: p });
    await masuk(u, p);
    ev.target.reset();
  } catch (e) {
    $('#galat-masuk').textContent = pesanGalat(e);
  }
});

/* ---------- daftar restoran ---------- */
async function muatKategori() {
  try {
    const r = await api('GET', '/kategori');
    $('#kategori').innerHTML = '<option value="">Semua kategori</option>' +
      r.data.map((k) => `<option value="${h(k.nama)}">${h(k.nama)} (${h(k.jumlah)})</option>`).join('');
  } catch (e) { /* abaikan */ }
}
async function muatDaftar() {
  const q = $('#q').value.trim();
  const kat = $('#kategori').value;
  try {
    const r = await api('GET', '/restoran?per_page=12&page=' + st.page +
      (q ? '&q=' + encodeURIComponent(q) : '') + (kat ? '&kategori=' + encodeURIComponent(kat) : ''));
    st.total_pages = r.meta.total_pages || 1;
    $('#info-daftar').textContent = r.meta.total + ' restoran ditemukan';
    $('#grid').innerHTML = r.data.map((x) => {
      const src = fotoSrc(x.foto);
      return `
      <a class="kartu" href="#/r/${encodeURIComponent(x.slug)}">
        <div class="foto">${src ? `<img src="${h(src)}" alt="${h(x.nama)}" loading="lazy">` : `<span class="inisial">${h((x.nama || '?').charAt(0).toUpperCase())}</span>`}</div>
        <div class="isi">
          <h3>${h(x.nama)}</h3>
          <span class="sub">${h(x.kategori)} &middot; ${h(x.kecamatan)}</span>
          <div class="bar"><span class="rating">&#9733; ${h(x.rating)} <small>(${h(x.jumlah_ulasan)})</small></span><span>${h(rupiah(x))}</span></div>
          <div>${labelHalal(x.info_halal)}</div>
        </div>
      </a>`;
    }).join('') || '<p>Tidak ada restoran yang cocok.</p>';
    $('#pager').innerHTML = `
      <button data-aksi="hal" data-ke="${st.page - 1}" ${st.page <= 1 ? 'disabled' : ''}>&lsaquo; Sebelumnya</button>
      <span>Halaman ${st.page} dari ${st.total_pages}</span>
      <button data-aksi="hal" data-ke="${st.page + 1}" ${st.page >= st.total_pages ? 'disabled' : ''}>Berikutnya &rsaquo;</button>`;
  } catch (e) {
    toast(pesanGalat(e));
  }
}

/* ---------- detail restoran + ulasan ---------- */
async function muatDetail(slug) {
  $('#v-detail').innerHTML = '<p class="info">Memuat...</p>';
  try {
    const d = (await api('GET', '/restoran/' + encodeURIComponent(slug))).data;
    const src = fotoSrc(d.foto);
    const grup = {};
    (d.menu || []).forEach((m) => { (grup[m.kategori || 'Lainnya'] = grup[m.kategori || 'Lainnya'] || []).push(m); });
    const menuHtml = Object.keys(grup).map((k) => `
      <h4 class="menu-grup">${h(k)}</h4>
      ${grup[k].map((m) => `<div class="menu-baris"><span>${h(m.nama)}</span><b>Rp ${Number(m.harga).toLocaleString('id-ID')}</b></div>`).join('')}`).join('')
      || '<p class="info">Belum ada data menu.</p>';
    const maps = d.link_maps && /^https?:\/\//i.test(d.link_maps)
      ? `<p><a class="tombol" href="${h(d.link_maps)}" target="_blank" rel="noopener">Buka di Google Maps</a></p>` : '';
    $('#v-detail').innerHTML = `
      <p><a href="#/">&larr; Semua restoran</a></p>
      <div class="detail-atas">
        <div class="foto-besar">${src ? `<img src="${h(src)}" alt="${h(d.nama)}">` : `<span class="inisial">${h((d.nama || '?').charAt(0).toUpperCase())}</span>`}</div>
        <div>
          <span class="sub">${h(d.kategori)} &middot; ${h(d.kecamatan)}</span>
          <h1 style="margin:4px 0;font-family:Georgia,serif">${h(d.nama)}</h1>
          <p class="rating">&#9733; ${h(d.rating)} <small>(${h(d.jumlah_ulasan)} ulasan Google)</small></p>
          <p>${h(d.alamat)}</p>
          <p>${h(rupiah(d))} ${labelHalal(d.info_halal)}</p>
          ${d.deskripsi ? `<p>${h(d.deskripsi)}</p>` : ''}
          ${maps}
        </div>
      </div>
      <section class="panel"><h2 style="margin-top:0">Menu</h2>${menuHtml}</section>
      <section class="panel" id="p-ulasan" data-id="${h(d.id)}"><h2 style="margin-top:0">Ulasan pengguna</h2><p class="info">Memuat ulasan...</p></section>`;
    muatUlasan(d.id);
  } catch (e) {
    $('#v-detail').innerHTML = `<p><a href="#/">&larr; Semua restoran</a></p><p class="galat">${h(pesanGalat(e))}</p>`;
  }
}

async function muatUlasan(id) {
  const kotak = $('#p-ulasan');
  try {
    const r = await api('GET', '/restoran/' + id + '/ulasan?per_page=50');
    const milik = r.data.find((u) => u.pengguna === saya) || null;
    const rata = r.meta.rata_rata_rating;
    const daftar = r.data.map((u) => `
      <div class="ulasan">
        <span class="bintang">${'&#9733;'.repeat(u.rating)}${'&#9734;'.repeat(5 - u.rating)}</span>
        <b>${h(u.pengguna)}</b> <small>${h(u.diubah || u.dibuat)}</small>
        ${u.komentar ? `<div>${h(u.komentar)}</div>` : ''}
      </div>`).join('') || '<p class="info">Belum ada ulasan. Jadilah yang pertama!</p>';
    const opsi = (n) => [5, 4, 3, 2, 1].map((x) => `<option value="${x}" ${x === n ? 'selected' : ''}>${x} bintang</option>`).join('');
    kotak.innerHTML = `
      <h2 style="margin-top:0">Ulasan pengguna</h2>
      <p class="info">${r.meta.total} ulasan${rata ? ' &middot; rata-rata ' + h(rata) + ' dari 5' : ''}</p>
      ${daftar}
      <h3>${milik ? 'Ulasanmu' : 'Tulis ulasan'}</h3>
      <form id="f-ulasan" data-id="${h(id)}" data-ulasan="${milik ? h(milik.id) : ''}" data-versi="${milik ? h(milik.versi) : ''}">
        <label>Rating</label><select name="rating">${opsi(milik ? milik.rating : 5)}</select>
        <label>Komentar (maksimal 500 karakter)</label>
        <textarea name="komentar" rows="3" maxlength="500">${milik ? h(milik.komentar || '') : ''}</textarea>
        <p id="galat-ulasan" class="galat" role="alert"></p>
        <button class="utama" type="submit">${milik ? 'Perbarui ulasan' : 'Kirim ulasan'}</button>
        ${milik ? '<button class="bahaya" type="button" data-aksi="hapus-ulasan">Hapus ulasanku</button>' : ''}
      </form>`;
  } catch (e) {
    kotak.innerHTML = `<h2 style="margin-top:0">Ulasan pengguna</h2><p class="galat">${h(pesanGalat(e))}</p>`;
  }
}
document.addEventListener('submit', async (ev) => {
  const f = ev.target;
  if (f.id !== 'f-ulasan') return;
  ev.preventDefault();
  const fd = new FormData(f);
  const body = { rating: Number(fd.get('rating')), komentar: fd.get('komentar') };
  try {
    if (f.dataset.ulasan) {
      body.versi = Number(f.dataset.versi);
      await api('PUT', '/ulasan/' + f.dataset.ulasan, body);
    } else {
      await api('POST', '/restoran/' + f.dataset.id + '/ulasan', body);
    }
    toast('Ulasan tersimpan.');
    muatUlasan(f.dataset.id);
  } catch (e) {
    const g = $('#galat-ulasan');
    if (g) g.textContent = pesanGalat(e) + (e.kode === 409 ? '\nMuat ulang halaman, lalu coba lagi.' : '');
  }
});
async function hapusUlasanku() {
  const f = $('#f-ulasan');
  if (!f || !f.dataset.ulasan || !confirm('Hapus ulasanmu?')) return;
  try {
    await api('DELETE', '/ulasan/' + f.dataset.ulasan);
    toast('Ulasan dihapus.');
    muatUlasan(f.dataset.id);
  } catch (e) {
    toast(pesanGalat(e));
  }
}

/* ---------- penghubung ---------- */
function arahkan() {
  if (!token) return;
  const m = location.hash.match(/^#\/r\/(.+)$/);
  if (m) {
    $('#v-daftar').hidden = true;
    $('#v-detail').hidden = false;
    muatDetail(decodeURIComponent(m[1]));
  } else {
    $('#v-detail').hidden = true;
    $('#v-daftar').hidden = false;
    muatDaftar();
  }
}
window.addEventListener('hashchange', arahkan);

const aksi = {
  keluar: () => keluar(),
  'ganti-mode': () => atur(!modeDaftar),
  cari: () => { st.page = 1; muatDaftar(); },
  hal: (d) => { st.page = Math.max(1, Number(d.ke)); muatDaftar(); },
  'hapus-ulasan': () => hapusUlasanku(),
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-aksi]');
  if (!el || el.disabled) return;
  const f = aksi[el.dataset.aksi];
  if (f) f(el.dataset);
});
$('#q').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { st.page = 1; muatDaftar(); } });
$('#kategori').addEventListener('change', () => { st.page = 1; muatDaftar(); });

if (token && saya) mulai();
</script>
</body>
</html>
